spring.application.name=valqui-api
server.port=8080

# MongoDB: en producción MONGODB_URI apunta a MongoDB Atlas (mongodb+srv://..., TLS)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/valqui}
spring.data.mongodb.auto-index-creation=true

spring.jackson.default-property-inclusion=non_null

# Pasarela de pago (simulada; la pasarela real es externa y no se construye)
pasarela.url-api=${PASARELA_URL_API:https://sandbox.pasarela-pagos.example/v1/cobros}
pasarela.api-key=${PASARELA_API_KEY:sk_test_valqui_simulada}

# Token de sesión (JWT)
valqui.jwt.secreto=${JWT_SECRETO:VAlqui-clave-secreta-de-desarrollo-cambiar-en-produccion-2026}
valqui.jwt.horas-expiracion=8
